
<!DOCTYPE html>
<html>
<head>
    <title>String and Math Functions</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: #e6e6fa;
        }

        h2 {
            color: blue;
        }

        h3 {
            color: purple;
        }
    </style>
</head>
<body>

    <h2>JavaScript String and Math Objects</h2>

    <h3>String Object Functions</h3>

    <script>
        let str = "Hello JavaScript";

        document.write("Original String: " + str + "<br>");
        document.write("Length: " + str.length + "<br>");
        document.write("Uppercase: " + str.toUpperCase() + "<br>");
        document.write("Lowercase: " + str.toLowerCase() + "<br>");
        document.write("Character at 1: " + str.charAt(1) + "<br>");
        document.write("Substring: " + str.substring(0, 5) + "<br>");
        document.write("Replace: " + str.replace("Hello", "Welcome") + "<br>");
        document.write("Index of JavaScript: " + str.indexOf("JavaScript") + "<br>");

        document.write("<h3>Math Object Functions</h3>");

        let num = 16.7;

        document.write("Number: " + num + "<br>");
        document.write("Square Root: " + Math.sqrt(25) + "<br>");
        document.write("Power: " + Math.pow(2, 3) + "<br>");
        document.write("Round: " + Math.round(num) + "<br>");
        document.write("Ceiling: " + Math.ceil(num) + "<br>");
        document.write("Floor: " + Math.floor(num) + "<br>");
        document.write("Absolute Value: " + Math.abs(-10) + "<br>");
        document.write("Maximum: " + Math.max(10, 20, 30) + "<br>");
        document.write("Minimum: " + Math.min(10, 20, 30) + "<br>");
        document.write("Random Number: " + Math.random() + "<br>");

    </script>

</body>
</html>
