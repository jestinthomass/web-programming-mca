<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMCT EXAM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #f1f5f9; color: #0f172a; }
  header { background: #0f172a; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #2563eb; }
  .timer { background: #1e293b; padding: 6px 14px; border-radius: 6px; font: bold 1.1rem monospace; color: #38bdf8; }
  .timer.danger { background: #dc2626; color: #fff; }
  .wrap { max-width: 1050px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 290px; gap: 20px; }
  .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
  .q-head { display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; margin-bottom: 16px; font-weight: 600; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1.5px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
  .opt:hover, .opt.sel { border-color: #2563eb; background: #eff6ff; }
  .btns { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 8px; flex-wrap: wrap; }
  button { padding: 9px 15px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: #e2e8f0; color: #1e293b; }
  .btn-next { background: #2563eb; color: #fff; }
  .btn-sub { background: #16a34a; color: #fff; transition: 0.2s; }
  .btn-sub:hover { background: #15803d; }
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
  .p-btn { height: 38px; border: 1px solid #cbd5e1; background: #f8fafc; }
  .p-btn.ans { background: #16a34a; color: #fff; border-color: #15803d; }
  .p-btn.act { background: #2563eb; color: #fff; border-color: #1d4ed8; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.78rem; color: #475569; border-top: 1px solid #e2e8f0; padding-top: 12px; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .res-card { max-width: 520px; margin: 40px auto; text-align: center; border-top: 5px solid #2563eb; background: linear-gradient(180deg, #eff6ff 0%, #fff 40%); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 22px; }
  .stat { padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
  .hidden { display: none; }
  @media (max-width: 740px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div><strong>KMCT EXAM</strong><br><small style="color:#94a3b8">Candidate ID: CBT-2026-401 | 10 Questions</small></div>
  <div id="timer" class="timer">01:00</div>
</header>

<main id="exam" class="wrap">
  <section class="card">
    <div class="q-head"><span id="q-num"></span><span style="color:#16a34a; background:#dcfce7; padding:2px 8px; border-radius:5px; font-size:0.85rem;">+4 / -1 Marks</span></div>
    <p id="q-text" style="font-size:1.05rem; font-weight:600; margin-bottom:16px;"></p>
    <div id="options"></div>
    <div class="btns">
      <div><button onclick="move(-1)">Previous</button> <button class="btn-next" onclick="move(1)">Save & Next</button></div>
      <button class="btn-sub" onclick="finishExam('Submitted by Candidate')">Submit Exam</button>
    </div>
  </section>
  <aside class="card">
    <strong>Question Palette (1–10)</strong>
    <div id="palette" class="palette"></div>
    <div class="legend">
      <span><i class="dot" style="background:#16a34a"></i>Answered</span>
      <span><i class="dot" style="background:#2563eb"></i>Active</span>
      <span><i class="dot" style="background:#e2e8f0"></i>Unvisited</span>
    </div>
  </aside>
</main>

<section id="result" class="card res-card hidden">
  <h2>Exam Scorecard</h2>
  <p id="reason" style="color:#475569; margin:4px 0 14px; font-size:0.9rem;"></p>
  <div style="background:#2563eb; color:#fff; display:inline-block; padding:10px 28px; border-radius:10px;">
    <small style="display:block; opacity:0.85;">TOTAL SCORE</small>
    <strong id="score" style="font-size:2rem;"></strong>
  </div>
  <div id="summary" class="stats"></div>
  <button class="btn-next" style="width:100%; padding:11px;" onclick="location.reload()">Retake Exam</button>
</section>

<script>
  const questions = [
    { q: "A train 180m long passes a pole in 12s. Time taken to cross a 420m platform?", opts: ["40 sec", "50 sec"], ans: 0 },
    { q: "What is the worst-case insertion time in a Binary Search Tree?", opts: ["O(log n)", "O(n)"], ans: 1 },
    { q: "Which OSI layer handles end-to-end flow control and segmentation?", opts: ["Network Layer", "Transport Layer"], ans: 1 },
    { q: "Find the next term in the series: 2, 6, 12, 20, 30, ?", opts: ["40", "42"], ans: 1 },
    { q: "Which CPU scheduling algorithm suffers from the 'Convoy Effect'?", opts: ["Round Robin", "FCFS"], ans: 1 },
    { q: "Which SQL command removes all rows without logging individual deletions?", opts: ["DELETE", "TRUNCATE"], ans: 1 },
    { q: "If 15 workers build a wall in 48 hours, how many workers are needed for 30 hours?", opts: ["24", "28"], ans: 0 },
    { q: "Which data structure is used internally to implement recursion?", opts: ["Queue", "Stack"], ans: 1 },
    { q: "What is the default port number for secure HTTPS traffic?", opts: ["80", "443"], ans: 1 },
    { q: "A sum doubles itself in 8 years at simple interest. What is the annual rate?", opts: ["12.5%", "15%"], ans: 0 }
  ];
  let idx = 0, time = 60, answers = Array(questions.length).fill(null);

  const clock = setInterval(() => {
    if (--time <= 0) return finishExam("Auto-Submitted (Time Expired)");
    const t = document.getElementById("timer");
    t.textContent = `${String(Math.floor(time / 60)).padStart(2, "0")}:${String(time % 60).padStart(2, "0")}`;
    if (time < 60) t.classList.add("danger");
  }, 1000);

  function render() {
    document.getElementById("q-num").textContent = `Question ${idx + 1} of ${questions.length}`;
    document.getElementById("q-text").textContent = questions[idx].q;
    document.getElementById("options").innerHTML = questions[idx].opts.map((opt, i) =>
      `<label class="opt ${answers[idx] === i ? "sel" : ""}" onclick="answers[idx]=${i};render()">
        <input type="radio" name="opt" ${answers[idx] === i ? "checked" : ""}> <strong>${i ? "B" : "A"}.</strong> ${opt}
      </label>`).join("");
    document.getElementById("palette").innerHTML = questions.map((_, i) =>
      `<button class="p-btn ${answers[i] !== null ? "ans" : ""} ${i === idx ? "act" : ""}" onclick="idx=${i};render()">${i + 1}</button>`).join("");
  }

  function move(step) { idx = (idx + step + questions.length) % questions.length; render(); }

  function finishExam(msg) {
    clearInterval(clock);
    let score = 0, correct = 0, wrong = 0;
    answers.forEach((a, i) => { if (a === questions[i].ans) { score += 4; correct++; } else if (a !== null) { score -= 1; wrong++; } });
    document.getElementById("exam").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");
    document.getElementById("reason").textContent = msg;
    document.getElementById("score").textContent = `${score} / ${questions.length * 4}`;
    document.getElementById("summary").innerHTML = `
      <div class="stat" style="background:#dcfce7;color:#166534;">Correct: ${correct}</div>
      <div class="stat" style="background:#fee2e2;color:#991b1b;">Wrong: ${wrong}</div>
      <div class="stat" style="background:#f1f5f9;color:#475569;">Unanswered: ${questions.length - correct - wrong}</div>`;
  }
  render();
</script>
</body>
</html>
