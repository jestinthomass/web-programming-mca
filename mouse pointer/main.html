<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Slide Hover Gallery</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: skyblue;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 380px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 20px;
        }

        .card-content h2 {
            margin: 0 0 10px;
            color: #333;
            font-size: 1.4rem;
        }

        .card-content p {
            margin: 0 0 15px;
            color: #666;
            font-size: 1rem;
            line-height: 1.4;
        }

        .counter {
            display: inline-block;
            background-color: #e9ecef;
            color: #495057;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="card" id="hoverCard">
        <img id="displayImage" src="https://picsum.photos/id/1018/400/300" alt="Mountain Range">
        <div class="card-content">
            <h2 id="displayTitle">1. Mountain Peaks</h2>
            <p id="displayText">Move your mouse off and back on this card to cycle through 5 different scenes!</p>
            <span class="counter" id="slideCounter">1 / 5</span>
        </div>
    </div>

    <script>
        // Select DOM elements
        const card = document.getElementById('hoverCard');
        const image = document.getElementById('displayImage');
        const title = document.getElementById('displayTitle');
        const text = document.getElementById('displayText');
        const counter = document.getElementById('slideCounter');

        // Array of multiple images and texts
        const slides = [
            {
                imgSrc: "https://picsum.photos/id/1018/400/300",
                imgAlt: "Mountain Range",
                title: "1. Mountain Peaks",
                text: "Move your mouse off and back on this card to cycle through 5 different scenes!"
            },
            {
                imgSrc: "https://picsum.photos/id/1015/400/300",
                imgAlt: "River Valley",
                title: "2. Serene River Valley",
                text: "Calm waters winding through steep, lush green cliffs."
            },
            {
                imgSrc: "https://picsum.photos/id/1039/400/300",
                imgAlt: "Forest Waterfall",
                title: "3. Hidden Waterfall",
                text: "Fresh spring water cascading deep inside an ancient forest."
            },
            {
                imgSrc: "https://picsum.photos/id/1043/400/300",
                imgAlt: "Misty Pines",
                title: "4. Misty Pine Woods",
                text: "Morning fog drifting silently through tall evergreen trees."
            },
            {
                imgSrc: "https://picsum.photos/id/1050/400/300",
                imgAlt: "Coastal Cliffs",
                title: "5. Rocky Coastline",
                text: "Ocean waves crashing against rugged seaside cliffs."
            }
        ];

        let currentIndex = 0;

        // Change to the next item in the array every time the mouse enters
        card.addEventListener('mouseenter', () => {
            currentIndex = (currentIndex + 1) % slides.length;

            const currentSlide = slides[currentIndex];
            image.src = currentSlide.imgSrc;
            image.alt = currentSlide.imgAlt;
            title.textContent = currentSlide.title;
            text.textContent = currentSlide.text;
            counter.textContent = `${currentIndex + 1} / ${slides.length}`;
        });
    </script>

</body>
</html>
